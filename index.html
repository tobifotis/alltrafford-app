<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>AllTrafford</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js"></script>
  </head>
  <body>
    <div id="display-view">
      <h1>Player profile</h1>

      <img src="bruno.jpg" />

      <span>Name: </span> <b id="name">Bruno Fernandez</b>
      <hr />

      <span>Email: </span> <b id="email">bruno.fernandez@example.com</b>
      <hr />

      <span>Position: </span> <b id="position">Midfielder</b>
      <hr />

      <button onclick="handleEditProfile()">Edit Profile</button>
    </div>

    <div id="edit-view">
      <h1>Player profile</h1>

      <img src="bruno.jpg" />

      <span>Name: </span> <input type="text" id="input-name" placeholder="Bruno Fernandez" />
      <hr />

      <span>Email: </span>
      <input type="text" id="input-email" placeholder="bruno.fernandez@example.com" />
      <hr />

      <span>Position: </span> <input type="text" id="input-position" placeholder="Midfielder" />
      <hr />

      <button onclick="handleUpdateProfile()">Update Profile</button>
    </div>
  </body>
</html>
